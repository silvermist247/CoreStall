    // Graduated Rapid-Click Spark Tracking
    let eventClickTimestamps = [];
    let currentSparkCombo = 0;
    const MAX_PARTICLES_CAP = 220;

    function triggerThemedWelderSparks(themeKey, evt) {
      if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
        resizeCanvas();
      }

      const originX = (evt && evt.clientX) ? evt.clientX : mousePos.x;
      const originY = (evt && evt.clientY) ? evt.clientY : mousePos.y;

      const now = performance.now();
      // Keep clicks within a 3.0-second rolling window so user can build up combo
      eventClickTimestamps = eventClickTimestamps.filter(t => now - t < 3000);
      eventClickTimestamps.push(now);
      currentSparkCombo = eventClickTimestamps.length;

      // Calculate click rate (clicks per second) for dynamic speed multiplier
      let clickRate = 1;
      if (eventClickTimestamps.length >= 2) {
        const timeSpan = (eventClickTimestamps[eventClickTimestamps.length - 1] - eventClickTimestamps[0]) / 1000;
        if (timeSpan > 0.05) {
          clickRate = Math.min(8, (eventClickTimestamps.length - 1) / timeSpan);
        }
      }

      // Faster clicking scales up particle size and speed continuously!
      const speedMultiplier = 1 + (clickRate * 0.25);
      const sizeMultiplier = 1 + (clickRate * 0.35);

      const sparkHues = COLOR_THEMES[themeKey] || COLOR_THEMES.orange;
      const isBigExplosion = currentSparkCombo >= 20;

      let count, minSpeed, maxSpeed, minSize, maxSize, decayRate;

      if (isBigExplosion) {
        // 20TH CLICK: BIG EXPLOSION! Massive fiery burst across screen!
        count = 65;
        minSpeed = 6.0 * speedMultiplier;
        maxSpeed = 12.0 * speedMultiplier;
        minSize = 3.5 * sizeMultiplier;
        maxSize = 5.8 * sizeMultiplier;
        decayRate = 0.016;
      } else if (currentSparkCombo >= 15) {
        // Pre-explosion frenzy (Clicks 15-19)
        count = 32;
        minSpeed = 4.0 * speedMultiplier;
        maxSpeed = 7.5 * speedMultiplier;
        minSize = 2.4 * sizeMultiplier;
        maxSize = 3.8 * sizeMultiplier;
        decayRate = 0.024;
      } else if (currentSparkCombo >= 10) {
        // Heavy shower (Clicks 10-14)
        count = 22;
        minSpeed = 3.0 * speedMultiplier;
        maxSpeed = 5.8 * speedMultiplier;
        minSize = 1.9 * sizeMultiplier;
        maxSize = 2.8 * sizeMultiplier;
        decayRate = 0.028;
      } else if (currentSparkCombo >= 5) {
        // CLICK COUNT 5: Sparks visibly grow bigger and branch outward!
        count = 14;
        minSpeed = 2.0 * speedMultiplier;
        maxSpeed = 4.2 * speedMultiplier;
        minSize = 1.4 * sizeMultiplier;
        maxSize = 2.2 * sizeMultiplier;
        decayRate = 0.034;
      } else {
        // STARTING STATE (Clicks 1-4): VERY SMALL, tucked right behind cursor tip
        count = 4;
        minSpeed = 0.5;
        maxSpeed = 1.2;
        minSize = 0.6;
        maxSize = 0.9;
        decayRate = 0.05;
      }

      // Cap active particle count for guaranteed 60fps performance
      if (sparkParticles.length + count > MAX_PARTICLES_CAP) {
        sparkParticles.splice(0, (sparkParticles.length + count) - MAX_PARTICLES_CAP);
      }

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = minSpeed + Math.random() * (maxSpeed - minSpeed);
        const colorObj = sparkHues[Math.floor(Math.random() * sparkHues.length)];
        const size = minSize + Math.random() * (maxSize - minSize);

        sparkParticles.push({
          x: originX,
          y: originY,
          prevX: originX,
          prevY: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          headColor: colorObj.head,
          tailColor: colorObj.tail,
          glowColor: colorObj.glow,
          width: size,
          lengthMult: isBigExplosion ? 4.5 : (currentSparkCombo >= 5 ? 2.5 : 1.4),
          alpha: 1.0,
          decay: decayRate,
          friction: isBigExplosion ? 0.96 : (currentSparkCombo >= 5 ? 0.92 : 0.88)
        });
      }

      if (!sparksLoop) {
        animateWelderSparks();
      }
    }

    function animateWelderSparks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = sparkParticles.length - 1; i >= 0; i--) {
        const p = sparkParticles[i];

        p.prevX = p.x;
        p.prevY = p.y;

        p.vx *= p.friction;
        p.vy *= p.friction;

        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          sparkParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.shadowBlur = p.width > 1.5 ? 12 : 5;
        ctx.shadowColor = p.glowColor;

        const tailX = p.prevX;
        const tailY = p.prevY;
        const headX = p.x;
        const headY = p.y;

        const grad = ctx.createLinearGradient(headX, headY, tailX, tailY);
        grad.addColorStop(0, p.headColor);
        grad.addColorStop(0.5, p.tailColor);
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.strokeStyle = grad;
        ctx.lineWidth = p.width;
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(headX, headY);
        ctx.stroke();

        // Bright spark white core
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(headX, headY, p.width * 0.55, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      if (sparkParticles.length > 0) {
        sparksLoop = requestAnimationFrame(animateWelderSparks);
      } else {
        sparksLoop = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function determineCartPosition(clickX) {
      const width = window.innerWidth;
      const x = (typeof clickX === 'number' && !isNaN(clickX)) ? clickX : mousePos.x;

      // Split viewport horizontally into three zones (left 35%, center 30%, right 35%)
      if (x < width * 0.35) {
        // User clicked on the LEFT side -> pop up on the RIGHT
        return 'pos-right';
      } else if (x > width * 0.65) {
        // User clicked on the RIGHT side -> pop up on the LEFT
        return 'pos-left';
      } else {
        // User clicked in the MIDDLE -> pop up in the CENTER
        return 'pos-center';
      }
    }

      const drawer = document.getElementById('cartDrawer');
      const overlay = document.getElementById('cartOverlay');
      if (!drawer || !overlay) return;

      if (open) {
        const posClass = targetPosition || determineCartPosition();
        drawer.classList.remove('pos-left', 'pos-right', 'pos-center');
        drawer.classList.add(posClass);
        // Force reflow before applying active so transition plays smoothly
        void drawer.offsetWidth;
        drawer.classList.add('active');
        overlay.classList.add('active');
      } else {
        drawer.classList.remove('active');
        overlay.classList.remove('active');
      }
    }

      function renderAntDance() {
        if (!isAntPartyActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Render Squashed Splat Mark on the stage canvas
        if (squashedSplat && !isDraggingSquashedAnt) {
          ctx.save();
          ctx.fillStyle = 'rgba(20, 24, 34, 0.88)';
          ctx.beginPath();
          ctx.ellipse(squashedSplat.x, squashedSplat.y + 4, 9, 3.5, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = squashedSplat.hatColor;
          ctx.beginPath();
          ctx.ellipse(squashedSplat.x - 3, squashedSplat.y + 2, 4, 1.8, -0.4, 0, Math.PI * 2);
          ctx.fill();

          // Particle puffs
          squashedSplat.particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.92;
            p.vy *= 0.92;
            p.alpha -= 0.025;
            if (p.alpha > 0) {
              ctx.fillStyle = `rgba(80, 90, 110, ${p.alpha})`;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fill();
            }
          });
          ctx.restore();
        }

        // Render Surviving Ants
        localAnts.forEach(ant => {
          if (ant.state === 'squashed') return;

          let drawX, drawY, tilt;

          if (ant.state === 'dancing') {
            ant.dancePhase += ant.danceSpeed;
            const hop = Math.abs(Math.sin(ant.dancePhase * 2)) * 6;
            const sway = Math.sin(ant.dancePhase) * 4;
            tilt = Math.cos(ant.dancePhase) * 0.25;

            drawX = ant.baseX + sway;
            drawY = ant.y - hop;
            ant.currentX = drawX;
            ant.currentY = drawY;
          } else if (ant.state === 'fleeing') {
            ant.dancePhase += 0.45;
            ant.currentX += ant.fleeDir * ant.fleeSpeed;
            drawX = ant.currentX;
            drawY = ant.y + (Math.sin(ant.dancePhase * 4) * 2);
            tilt = ant.fleeDir * 0.55;
          }

          if (drawX < -40 || drawX > canvas.width + 40) return;

          ctx.save();
          ctx.translate(drawX, drawY);
          ctx.rotate(tilt);

          const s = ant.size;
          ctx.fillStyle = '#0f141d';

          ctx.beginPath();
          ctx.ellipse(0, s * 1.3, s * 0.8, s * 1.1, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.ellipse(0, 0, s * 0.5, s * 0.65, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.ellipse(0, -s * 1.1, s * 0.6, s * 0.65, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#2d3748';
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          for (let side = -1; side <= 1; side += 2) {
            const legKick = Math.sin(ant.dancePhase * 3) * (ant.state === 'fleeing' ? 4.5 : 3);
            ctx.moveTo(side * s * 0.3, -s * 0.3);
            ctx.lineTo(side * (s * 1.4 + legKick), -s * 1.2);
            ctx.lineTo(side * (s * 2.0 + legKick), -s * 0.7);

            ctx.moveTo(side * s * 0.4, 0);
            ctx.lineTo(side * (s * 1.5 - legKick * 0.5), 0);
            ctx.lineTo(side * (s * 2.1 - legKick * 0.5), s * 0.5);

            ctx.moveTo(side * s * 0.3, s * 0.4);
            ctx.lineTo(side * (s * 1.4 + legKick), s * 1.1);
            ctx.lineTo(side * (s * 2.0 + legKick), s * 1.6);
          }
          ctx.stroke();

          ctx.strokeStyle = '#4a5568';
          ctx.lineWidth = 0.9;
          ctx.beginPath();
          ctx.moveTo(-s * 0.25, -s * 1.5);
          ctx.lineTo(-s * 0.7, -s * 2.4 + Math.sin(ant.dancePhase * 3) * 1.5);
          ctx.moveTo(s * 0.25, -s * 1.5);
          ctx.lineTo(s * 0.7, -s * 2.4 + Math.cos(ant.dancePhase * 3) * 1.5);
          ctx.stroke();

          ctx.fillStyle = ant.hatColor;
          ctx.beginPath();
          ctx.moveTo(0, -s * 2.6);
          ctx.lineTo(-s * 0.45, -s * 1.4);
          ctx.lineTo(s * 0.45, -s * 1.4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, -s * 2.7, s * 0.25, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        });

        antPartyAnimId = requestAnimationFrame(renderAntDance);
      }

      renderAntDance();

        desc: 'Pure post-race champagne celebration in intense afternoon backlight • 85mm f/1.4',
        price: 320,

    ];

    let activeFavoriteIdx = 0;

    function initFavoritesList() {
      const container = document.getElementById('favoritesListContainer');
      if (!container) return;

      container.innerHTML = SETH_FAVORITES.map((item, idx) => `
        <div class="favorite-item-row ${idx === activeFavoriteIdx ? 'active' : ''}" onclick="selectFavoritePhoto(${idx}, event)">

    // Open out of the frame into a new Secret Section (ONLY ONCE PANEL IS THROWN AWAY!)
    function toggleFavoritesDropdown(e) {
      if (e) e.stopPropagation();
      if (!window.isPanelThrownAway) return; // Strict lock: Only accessible after panel is thrown in trash!

      openSecretFavoritesSection();
    }

    function openSecretFavoritesSection() {
      const section = document.getElementById('secretFavoritesSection');
      if (!section) return;

      renderSecretFavoritesGrid();
      section.classList.add('unlocked-open');

      // Smooth cinematic scroll down into the unlocked section
      setTimeout(() => {
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 150);
    }

    function closeSecretFavoritesSection() {
      const section = document.getElementById('secretFavoritesSection');
      if (section) {
        section.classList.remove('unlocked-open');
        // Scroll back to Bio
        const aboutSec = document.getElementById('about');
        if (aboutSec) aboutSec.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function renderSecretFavoritesGrid() {

      if (!container) return;

      const SECRET_ITEMS = [
        {

        {

      ];

      container.innerHTML = SECRET_ITEMS.map((item, idx) => `
        <article class="secret-card">
          <img src="${item.src}" alt="${item.title}" loading="lazy">
          <div class="secret-card-overlay">

              <button class="secret-card-btn" onclick="addToCart('${item.title.replace(/'/g, "\\'")}', ${item.price}, event)">+ Add to Cart</button>

        </article>

    }

    function selectFavoritePhoto(idx, e) {
      if (e) e.stopPropagation();
      activeFavoriteIdx = idx;
      const item = SETH_FAVORITES[idx];
      const activeImg = document.getElementById('favoritesActiveImg');
      const badgeText = document.getElementById('favoritesBadgeText');
      const underlayer = document.getElementById('aboutSecretUnderlayer');

      if (activeImg) {
        activeImg.style.opacity = '0';
        setTimeout(() => {

      }

      if (badgeText) {

      setTimeout(() => {

    document.addEventListener('DOMContentLoaded', initFavoritesList);
    initFavoritesList();

  
    // =========================================================================
    // HERO DEEP SPACE ENGINE: FLOATING STARS, TWINKLING CLUSTERS & CELESTIAL DUST
    // =========================================================================
// =========================================================================
    // HERO DEEP SPACE ENGINE: FLOATING STARS, TWINKLING CLUSTERS & CELESTIAL DUST
    // =========================================================================
    (function initHeroSpaceEngine() {
      const sCanvas = document.getElementById('spaceCanvas');
      if (!sCanvas) return;
      const sCtx = sCanvas.getContext('2d');
      const heroEl = document.getElementById('hero');
      let stars = [];
      let shootingStars = [];
      let spaceAnimationId;

      let heroMouse = { x: -1000, y: -1000, active: false };
      // Cursor Tracking for Persistent Orbit
      if (heroEl) {
        window.addEventListener('mousemove', (e) => {
          const rect = sCanvas.getBoundingClientRect();
          heroMouse.x = e.clientX - rect.left;
          heroMouse.y = e.clientY - rect.top;
          heroMouse.active = (e.clientY >= rect.top && e.clientY <= rect.bottom);
        });

        heroEl.addEventListener('mouseleave', () => {
          heroMouse.active = false;
        });
      }

      // Support up to 10 SIMULTANEOUS CLICKED STAR ORBITS!
      const MAX_ACTIVE_ANCHORS = 10;
      let activeAnchorStars = [];

      // Function to handle clicking on a star or in space:
      function handleStarClick(clientX, clientY) {
        const rect = sCanvas.getBoundingClientRect();
        const clickX = clientX - rect.left;
        const clickY = clientY - rect.top;

        // Find the closest star within 55px of click (or use exact click location)
        let closestStar = null;
        let minDist = 55;

        for (let i = 0; i < stars.length; i++) {
          const d = Math.hypot(stars[i].x - clickX, stars[i].y - clickY);
          if (d < minDist) {
            minDist = d;
            closestStar = stars[i];
          }
        }

        const anchorX = closestStar ? closestStar.x : clickX;
        const anchorY = closestStar ? closestStar.y : clickY;

        // If we reached the cap of 10, remove the oldest anchor cleanly
        if (activeAnchorStars.length >= MAX_ACTIVE_ANCHORS) {
          const oldest = activeAnchorStars.shift();
          if (oldest.starRef) oldest.starRef.isAnchor = false;
        }

        const newAnchor = {
          id: 'anchor_' + performance.now() + '_' + Math.random(),
          x: anchorX,
          y: anchorY,
          starRef: closestStar,
          radius: 190,
          speed: 1.0,
          startTime: performance.now(),
          duration: 20000 // Each orbit lasts for 20 seconds!
        };

        activeAnchorStars.push(newAnchor);

        if (closestStar) {
          closestStar.isAnchor = true;
          closestStar.anchorPulse = 2.5; // Beacon illumination
        }
      }

      sCanvas.addEventListener('pointerdown', (e) => {
        handleStarClick(e.clientX, e.clientY);
      });

      // Also listen on hero element for clicks
      heroEl.addEventListener('pointerdown', (e) => {
        // If not clicking a button/link inside the HUD:
        if (!e.target.closest('a') && !e.target.closest('button')) {
          handleStarClick(e.clientX, e.clientY);
        }
      });

      function resizeSpace() {
        if (!heroEl) return;
        sCanvas.width = heroEl.offsetWidth || window.innerWidth;
        sCanvas.height = heroEl.offsetHeight || window.innerHeight;
      }

      window.addEventListener('resize', resizeSpace);
      resizeSpace();

      // Create 200 floating stars with individual orbital rates
      const STAR_COUNT = 200;
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        const initX = Math.random() * (sCanvas.width || window.innerWidth);
        const initY = Math.random() * (sCanvas.height || window.innerHeight);
        stars.push({
          x: initX,
          y: initY,
          originX: initX,
          originY: initY,
          vx: 0,
          vy: 0,
          size: Math.random() * 1.8 + 0.6,
          baseAlpha: Math.random() * 0.7 + 0.3,
          twinkleSpeed: Math.random() * 0.03 + 0.008,
          twinklePhase: Math.random() * Math.PI * 2,
          driftSpeedX: (Math.random() - 0.5) * 0.16,
          driftSpeedY: (Math.random() - 0.5) * 0.12,
          orbitDir: Math.random() > 0.5 ? 1 : -1,
          orbitRate: 0.035 + Math.random() * 0.04,
          isAnchor: false,
          anchorPulse: 1.0,
          color: Math.random() > 0.75 
            ? 'rgba(0, 240, 255,' 
            : (Math.random() > 0.5 ? 'rgba(255, 215, 0,' : 'rgba(255, 255, 255,')
        });
      }

      function spawnShootingStar() {
        if (shootingStars.length < 2 && Math.random() < 0.02) {
          shootingStars.push({
            x: Math.random() * sCanvas.width * 0.8,
            y: Math.random() * (sCanvas.height * 0.45),
            length: Math.random() * 85 + 50,
            speed: Math.random() * 8 + 6,
            angle: Math.PI / 4 + (Math.random() - 0.5) * 0.2,
            alpha: 1,
            decay: 0.02
          });
        }
      }

      // Interactive Subtler 3D Pull-Up & Gentle Tilt on Hover (Seth Barton block moves less)
      const hudFrame = document.querySelector('.hero-hud-frame');
      if (heroEl && hudFrame) {
        heroEl.addEventListener('mousemove', (e) => {
          const rect = hudFrame.getBoundingClientRect();
          const frameCenterX = rect.left + rect.width / 2;
          const frameCenterY = rect.top + rect.height / 2;

          const mouseX = e.clientX - frameCenterX;
          const mouseY = e.clientY - frameCenterY;

          const distToCenter = Math.hypot(mouseX, mouseY);
          if (distToCenter < 600) {
            const tiltX = (mouseY / (rect.height / 2)) * -3.2; 
            const tiltY = (mouseX / (rect.width / 2)) * 3.2;
            hudFrame.style.transform = `perspective(1000px) translateY(-5px) translateZ(14px) rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg)`;
          } else {
            hudFrame.style.transform = 'perspective(1000px) translateY(0px) translateZ(0px) rotateX(0deg) rotateY(0deg)';
          }
        });

        heroEl.addEventListener('mouseleave', () => {
          hudFrame.style.transform = 'perspective(1000px) translateY(0px) translateZ(0px) rotateX(0deg) rotateY(0deg)';
        });
      }

      function renderSpace() {
        sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);

        // Update lifetimes for all active anchor stars (up to 10)
        const now = performance.now();
        for (let a = activeAnchorStars.length - 1; a >= 0; a--) {
          const anchor = activeAnchorStars[a];
          const elapsed = now - anchor.startTime;
          if (elapsed < anchor.duration) {
            // Smooth bell curve envelope so orbits accelerate in and fade gracefully out over 20s
            anchor.speed = Math.sin((elapsed / anchor.duration) * Math.PI);
          } else {
            if (anchor.starRef) anchor.starRef.isAnchor = false;
            activeAnchorStars.splice(a, 1);
          }
        }

        const hasActiveAnchors = activeAnchorStars.length > 0;

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];

          // 1. Ambient gentle cosmic drift
          s.originX += s.driftSpeedX;
          s.originY += s.driftSpeedY;

          if (s.originX < 0) s.originX = sCanvas.width;
          if (s.originX > sCanvas.width) s.originX = 0;
          if (s.originY < 0) s.originY = sCanvas.height;
          if (s.originY > sCanvas.height) s.originY = 0;

          // 2. CURSOR HOVER ORBIT: Weaker, slower, gentle ambient drift around cursor!
          if (heroMouse.active) {
            const mDx = heroMouse.x - s.x;
            const mDy = heroMouse.y - s.y;
            const mDist = Math.hypot(mDx, mDy);
            const CURSOR_ORBIT_MAX = 160;

            if (mDist < CURSOR_ORBIT_MAX && mDist > 2) {
              const mInfluence = (1 - (mDist / CURSOR_ORBIT_MAX));
              
              // Soft, weak radial attraction (~85px wide band)
              const mRadialForce = (mDist - 85) * 0.0045 * mInfluence;
              const mNormX = mDx / mDist;
              const mNormY = mDy / mDist;

              // Significantly slower, subtle tangential rotation (~65% slower)
              const mTangentX = -mNormY * s.orbitDir;
              const mTangentY = mNormX * s.orbitDir;
              const mOrbitSpeed = 0.52 * mInfluence * s.orbitRate * 18;

              s.vx += (mNormX * mRadialForce) + (mTangentX * mOrbitSpeed);
              s.vy += (mNormY * mRadialForce) + (mTangentY * mOrbitSpeed);
            }
          }

          // 3. MULTI-ANCHOR CLICK ORBITS: Up to 10 simultaneous gravitational systems!
          if (hasActiveAnchors) {
            for (let a = 0; a < activeAnchorStars.length; a++) {
              const anchor = activeAnchorStars[a];
              if (anchor.speed <= 0.01) continue;

              // If this star is the anchor itself, lock it gently to anchor center
              if (s === anchor.starRef) {
                s.vx *= 0.5;
                s.vy *= 0.5;
              } else {
                const dx = anchor.x - s.x;
                const dy = anchor.y - s.y;
                const dist = Math.hypot(dx, dy);

                if (dist < anchor.radius && dist > 5) {
                  const influence = (1 - (dist / anchor.radius)) * anchor.speed;

                  // Unique orbital tier for each particle
                  const targetOrbitR = 52 + (i % 6) * 16;
                  const radialForce = (dist - targetOrbitR) * 0.02 * influence;
                  const normX = dx / dist;
                  const normY = dy / dist;

                  // Tangential orbit velocity around clicked star
                  const tangentX = -normY * s.orbitDir;
                  const tangentY = normX * s.orbitDir;
                  const orbitSpeed = 2.4 * influence;

                  s.vx += (normX * radialForce) + (tangentX * orbitSpeed);
                  s.vy += (normY * radialForce) + (tangentY * orbitSpeed);
                }
              }
            }
          }

          // 4. Return spring gently pulling stars back to natural drift
          const springPower = (heroMouse.active || hasActiveAnchors) ? 0.015 : 0.035;
          s.vx += (s.originX - s.x) * springPower;
          s.vy += (s.originY - s.y) * springPower;

          s.vx *= 0.88;
          s.vy *= 0.88;

          s.x += s.vx;
          s.y += s.vy;

          s.twinklePhase += s.twinkleSpeed;
          let currentAlpha = Math.max(0.14, s.baseAlpha + Math.sin(s.twinklePhase) * 0.35);

          // Anchor star beacon glow
          let currentSize = s.size;
          if (s.isAnchor) {
            currentSize = s.size * 2.2;
            currentAlpha = 1.0;
            sCtx.shadowBlur = 15;
            sCtx.shadowColor = '#00f0ff';
          } else {
            sCtx.shadowBlur = 0;
          }

          sCtx.fillStyle = s.color + currentAlpha + ')';
          sCtx.beginPath();
          sCtx.arc(s.x, s.y, currentSize, 0, Math.PI * 2);
          sCtx.fill();

          // Small, refined star cross gleam
          if ((currentSize > 1.8 || s.isAnchor) && currentAlpha > 0.6) {
            sCtx.strokeStyle = s.color + (currentAlpha * 0.45) + ')';
            sCtx.lineWidth = 0.5;
            sCtx.beginPath();
            sCtx.moveTo(s.x - currentSize * 1.3, s.y);
            sCtx.lineTo(s.x + currentSize * 1.3, s.y);
            sCtx.moveTo(s.x, s.y - currentSize * 1.3);
            sCtx.lineTo(s.x, s.y + currentSize * 1.3);
            sCtx.stroke();
          }
          sCtx.shadowBlur = 0;
        }

        // Render shooting stars streaks
        spawnShootingStar();
        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const ss = shootingStars[i];
          const tailX = ss.x - Math.cos(ss.angle) * ss.length;
          const tailY = ss.y - Math.sin(ss.angle) * ss.length;

          const grad = sCtx.createLinearGradient(ss.x, ss.y, tailX, tailY);
          grad.addColorStop(0, `rgba(255, 255, 255, ${ss.alpha})`);
          grad.addColorStop(0.3, `rgba(0, 240, 255, ${ss.alpha * 0.8})`);
          grad.addColorStop(1, 'rgba(0, 240, 255, 0)');

          sCtx.strokeStyle = grad;
          sCtx.lineWidth = 1.6;
          sCtx.lineCap = 'round';
          sCtx.beginPath();
          sCtx.moveTo(tailX, tailY);
          sCtx.lineTo(ss.x, ss.y);
          sCtx.stroke();

          ss.x += Math.cos(ss.angle) * ss.speed;
          ss.y += Math.sin(ss.angle) * ss.speed;
          ss.alpha -= ss.decay;

          if (ss.alpha <= 0 || ss.x > sCanvas.width || ss.y > sCanvas.height) {
            shootingStars.splice(i, 1);
          }
        }        spaceAnimationId = requestAnimationFrame(renderSpace);
      }

      renderSpace();
    })();
  
    // =========================================================================
    // SPRING-LOADED MECHANICAL BUTTON ENGINE
    // Depresses down, holds pressure, and pops back up in 2 seconds with spring recoil!
    // =========================================================================
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn');
      if (btn && !btn.classList.contains('spring-pressed')) {
        btn.classList.add('spring-pressed');
        setTimeout(() => {
          btn.classList.remove('spring-pressed');
        }, 2000);
      }
    });

  </script>
